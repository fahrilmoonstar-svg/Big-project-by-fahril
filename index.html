<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fahril Project - Big Showcase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           RESET & GLOBAL
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* ================================================================
           NAVIGASI UTAMA
           ================================================================ */
        .main-nav {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 15px 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .main-nav .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-nav .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            list-style: none;
        }

        .main-nav .nav-links a {
            color: #a0a0c0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .main-nav .nav-links a:hover,
        .main-nav .nav-links a.active {
            background: rgba(168, 85, 247, 0.15);
            color: #fff;
        }

        .main-nav .nav-links a.cta {
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            color: #fff;
        }

        .main-nav .nav-links a.cta:hover {
            transform: scale(1.05);
        }

        /* ================================================================
           HERO SECTION (UTAMA)
           ================================================================ */
        .hero {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff6ba0, #a855f7, #4fc3f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h2 {
            font-size: 1.5rem;
            margin: 15px 0 0 0;
            letter-spacing: 15px;
            font-weight: 300;
            opacity: 0.95;
            color: #e0e0e0;
            text-shadow: 0 0 20px rgba(255, 107, 160, 0.3);
        }

        .hero .subtitle {
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-weight: 300;
            color: #b0b0b0;
            margin-top: 15px;
            opacity: 0.8;
        }

        .btn-cta {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(255, 107, 160, 0.3);
        }

        .btn-cta:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 40px rgba(255, 107, 160, 0.5);
        }

        /* ================================================================
           SECTION CARD (HOME / ABOUT / CONTACT)
           ================================================================ */
        .section-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .section-card:hover {
            transform: translateY(-4px);
            border-color: #a855f7;
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.15);
        }

        .section-card h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-card p {
            color: #a0a0c0;
            font-size: 16px;
            line-height: 1.6;
        }

        /* ================================================================
           ABOUT SECTION (WHY CHOOSE US)
           ================================================================ */
        .about-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .about-box h2 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .about-box .sub {
            text-align: center;
            color: #a0a0c0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .about-list {
            list-style: none;
            padding: 0;
        }

        .about-list li {
            padding: 18px 20px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            cursor: default;
        }

        .about-list li:hover {
            transform: translateX(4px);
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }

        .about-list li strong {
            display: block;
            font-size: 18px;
            color: #ff6ba0;
            margin-bottom: 6px;
        }

        .about-list li span {
            font-size: 15px;
            color: #c0c0c0;
            line-height: 1.6;
        }

        /* ================================================================
           SLIDER EMOJI (MOOD TRACKER)
           ================================================================ */
        .emoji-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .emoji-box h2 {
            font-size: 20px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #emoji {
            font-size: 80px;
            margin: 10px 0;
            transition: transform 0.2s ease;
        }

        #status {
            font-size: 18px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 15px;
            min-height: 30px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #4ade80, #54a0ff, #a855f7);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .mood-stats {
            margin-top: 15px;
            font-size: 14px;
            color: #a0a0c0;
        }

        .mood-stats span {
            color: #ff6ba0;
            font-weight: 600;
        }

        /* ================================================================
           CANVAS DRAW (TANDA TANGAN)
           ================================================================ */
        .draw-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .draw-box h2 {
            font-size: 20px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #drawCanvas {
            display: block;
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1/1;
            background: #1a1a2e;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: crosshair;
            touch-action: none;
            margin: 0 auto;
        }

        .draw-controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .draw-controls button {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .draw-controls button:hover {
            background: #a855f7;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3);
        }

        .download-btn {
            background: #4ade80 !important;
            color: #1a1a2e !important;
        }

        .download-btn:hover {
            background: #22c55e !important;
        }

        /* ================================================================
           FORM REGISTRASI (VALIDASI)
           ================================================================ */
        .register-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .register-box h2 {
            font-size: 20px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .register-box .sub {
            text-align: center;
            color: #a0a0c0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: #c0c0c0;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        .form-group input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.15);
        }

        .form-group input.success {
            border-color: #4ade80;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
        }

        .form-group .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-group .error-msg.show {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            margin-top: 5px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3);
        }

        /* ================================================================
           TO-DO LIST PRO
           ================================================================ */
        .todo-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .todo-box h2 {
            font-size: 20px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .todo-box .sub {
            text-align: center;
            color: #a0a0c0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .todo-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            font-family: inherit;
            min-width: 150px;
        }

        .todo-input-group input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        .todo-input-group select {
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        .todo-input-group button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .todo-input-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3);
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .todo-list li:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }

        .todo-list li .todo-text {
            flex: 1;
            font-size: 15px;
        }

        .todo-list li .todo-text.done {
            text-decoration: line-through;
            color: #666;
        }

        .todo-list li .priority {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 50px;
        }

        .priority-high {
            background: #ff6b6b;
            color: #1a1a2e;
        }

        .priority-normal {
            background: #fbbf24;
            color: #1a1a2e;
        }

        .todo-list li .delete-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        .todo-list li .delete-btn:hover {
            transform: scale(1.2);
        }

        .todo-list li input[type="checkbox"] {
            accent-color: #a855f7;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .todo-empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        /* ================================================================
           SIGN UP FORM (ANIMATED)
           ================================================================ */
        .signup-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .signup-box .orb-inner {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            z-index: 0;
        }

        .signup-box .orb-inner-1 {
            width: 150px;
            height: 150px;
            background: #ff6ba0;
            top: -40px;
            left: -40px;
            animation: orbFloat 6s ease-in-out infinite alternate;
        }

        .signup-box .orb-inner-2 {
            width: 180px;
            height: 180px;
            background: #a855f7;
            bottom: -50px;
            right: -50px;
            animation: orbFloat 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.2); }
        }

        .signup-box .form-card {
            position: relative;
            z-index: 1;
        }

        .signup-box h2 {
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .signup-box .subtitle {
            text-align: center;
            color: #a0a0c0;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .signup-box .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .signup-box .input-group {
            margin-bottom: 16px;
        }

        .signup-box .input-group label {
            display: block;
            color: #c0c0c0;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .signup-box .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
            font-family: inherit;
        }

        .signup-box .input-group input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.15);
        }

        .signup-box .input-group.full-width {
            grid-column: 1 / -1;
        }

        .signup-box .btn-signup {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            margin-top: 5px;
        }

        .signup-box .btn-signup:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.3);
        }

        .signup-box .form-footer {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 18px;
        }

        .signup-box .form-footer a {
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
        }

        /* ================================================================
           ORDENAN PROJECT (KOMPONEN)
           ================================================================ */
        .ordenan-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 35px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ordenan-box .ordenan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ordenan-box .ordenan-header h2 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ordenan-box .ordenan-header .badge-ordenan {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 50px;
            padding: 4px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #a855f7;
        }

        .ordenan-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .ordenan-text {
            text-align: left;
        }

        .ordenan-text h3 {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ordenan-text .desc {
            font-size: 0.95rem;
            color: #a0a0c0;
            line-height: 1.8;
            margin-bottom: 18px;
        }

        .ordenan-text .desc span {
            color: #ff6ba0;
            font-weight: 600;
        }

        .ordenan-skills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .ordenan-skills .skill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #c0c0c0;
            transition: 0.3s;
        }

        .ordenan-skills .skill:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }

        .ordenan-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .ordenan-buttons .btn-primary {
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff6ba0, #a855f7);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
